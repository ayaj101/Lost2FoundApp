spring.application.name=Lost2Found
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${TIDB_HOST}:${TIDB_PORT:4000}/lost2found?sslMode=VERIFY_IDENTITY&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${TIDB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${TIDB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.springframework=INFO

# Image analysis model
OPENAI_API_KEY=${OPENAI_API_KEY}

openai.vision.url=https://api.openai.com/v1/responses
openai.vision.model=gpt-4.1-mini

# embedding model
openai.api.key=${OPENAI_API_KEY}
openai.embeddings.url=https://api.openai.com/v1/embeddings
openai.embeddings.model=text-embedding-3-small