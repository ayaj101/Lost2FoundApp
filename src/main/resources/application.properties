spring.application.name=Lost2Found
server.port=${PORT:8080}

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.error.include-message=always
server.error.include-stacktrace=always
logging.level.org.springframework=DEBUG

# Image analysis model
OPENAI_API_KEY=${OPENAI_API_KEY}

openai.vision.url=https://api.openai.com/v1/responses
openai.vision.model=gpt-4.1-mini

# embedding model
openai.api.key=${OPENAI_API_KEY}
openai.embeddings.url=https://api.openai.com/v1/embeddings
openai.embeddings.model=text-embedding-3-small