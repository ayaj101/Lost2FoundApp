spring.application.name=Lost2Found
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Resend email API
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Lost2Found <onboarding@resend.dev>}

# Twilio SMS API
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.from=${TWILIO_FROM:}

server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.springframework=INFO

# Image analysis model
OPENAI_API_KEY=${OPENAI_API_KEY}

openai.vision.url=https://api.openai.com/v1/responses
openai.vision.model=gpt-4.1-mini

# embedding model
openai.api.key=${OPENAI_API_KEY}
openai.embeddings.url=https://api.openai.com/v1/embeddings
openai.embeddings.model=text-embedding-3-small